name: Static stack policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  enforce-static-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require plain HTML CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          for required in index.html styles.css script.js; do
            if [ ! -f "$required" ]; then
              echo "::error file=$required::Required static source file is missing."
              failed=1
            fi
          done

          forbidden_files=(
            package.json package-lock.json yarn.lock pnpm-lock.yaml
            tsconfig.json next.config.js next.config.mjs next.config.ts
            vite.config.js vite.config.mjs vite.config.ts
            wrangler.toml wrangler.json wrangler.jsonc
            .openai/hosting.json
          )

          for path in "${forbidden_files[@]}"; do
            if [ -e "$path" ]; then
              echo "::error file=$path::Forbidden framework/build/runtime file."
              failed=1
            fi
          done

          for dir in app components node_modules .next; do
            if [ -d "$dir" ]; then
              echo "::error file=$dir::Forbidden framework/build directory."
              failed=1
            fi
          done

          while IFS= read -r path; do
            echo "::error file=$path::TypeScript/TSX is forbidden; use static HTML/CSS/JS."
            failed=1
          done < <(find . -type f \( -name '*.ts' -o -name '*.tsx' \) -not -path './.git/*')

          if [ "$failed" -ne 0 ]; then
            echo "Static stack policy failed. Rebuild from website-template as direct HTML/CSS/JS."
            exit 1
          fi

          echo "Static stack policy passed."

      - name: Enforce canonical form and local CTA contract
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          import sys
          import re

          required = ["name", "phone", "address", "service", "message"]
          failures = []

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.current = None
                  self.local_ctas = 0
                  self.lead_anchor = False

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id") == "lead-form":
                      self.lead_anchor = True
                  if tag == "a" and data.get("href") == "#lead-form":
                      self.local_ctas += 1
                  if tag == "form":
                      self.current = {}
                      self.forms.append(self.current)
                  elif self.current is not None and tag in ("input", "select", "textarea"):
                      name = data.get("name")
                      if name:
                          self.current[name] = "required" in data

              def handle_endtag(self, tag):
                  if tag == "form":
                      self.current = None

          for path in sorted(Path(".").rglob("*.html")):
              if ".git" in path.parts or path.name == "404.html":
                  continue
              audit = Audit()
              audit.feed(path.read_text(encoding="utf-8"))

              if not audit.lead_anchor:
                  failures.append(f"{path}: missing id=lead-form")
              if len(audit.forms) != 1:
                  failures.append(f"{path}: expected exactly one form, found {len(audit.forms)}")
                  continue

              form = audit.forms[0]
              for field in required:
                  if field not in form:
                      failures.append(f"{path}: missing required field {field}")
                  elif not form[field]:
                      failures.append(f"{path}: field {field} lacks required attribute")

              area_selects = re.findall(
                  r'<select\\b[^>]*\\bname=["\\\'](?:area|district|service_area|location)["\\\'][^>]*>(.*?)</select>',
                  path.read_text(encoding="utf-8"),
                  flags=re.IGNORECASE | re.DOTALL,
              )
              for body in area_selects:
                  options = re.findall(r'<option\\b[^>]*>(.*?)</option>', body, flags=re.IGNORECASE | re.DOTALL)
                  labels = [re.sub(r'<[^>]+>', '', option).strip() for option in options]
                  selectable = [label for label in labels if label]
                  language = re.search(
                      r'<html\b[^>]*\blang=["\']([^"\']+)',
                      path.read_text(encoding="utf-8"),
                      re.IGNORECASE,
                  )
                  localized_other = {"lv": "cits", "en": "other", "ru": "другое"}
                  expected_other = localized_other.get(
                      language.group(1).casefold() if language else "lv", "cits"
                  )
                  if not selectable or selectable[-1].casefold() != expected_other:
                      failures.append(
                          f"{path}: area dropdown must end with localized option {expected_other}"
                      )

              if audit.local_ctas < 1:
                  failures.append(f"{path}: no local href=#lead-form CTA")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit("Canonical form policy failed.")

          print("Canonical form and local CTA policy passed.")
